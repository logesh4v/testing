<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Management System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            text-align: center;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            margin: auto;
        }
        input {
            margin: 10px;
            padding: 8px;
            width: 80%;
        }
        button {
            padding: 10px;
            background-color: blue;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: darkblue;
        }
        ul {
            list-style-type: none;
            padding: 0;
        }
        li {
            background: lightgreen;
            margin: 5px;
            padding: 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Hotel Management System</h1>
        
        <label for="minPrice">Min Price:</label>
        <input type="number" id="minPrice" placeholder="Enter min price">
 
        <label for="maxPrice">Max Price:</label>
        <input type="number" id="maxPrice" placeholder="Enter max price">
 
        <button onclick="searchRooms()">Find Available Rooms</button>
 
        <h2>Available Rooms:</h2>
        <ul id="roomList"></ul>
    </div>
 
    <script>
        const hotelRooms = [
            { type: "Standard", price: 5000, available: true },
            { type: "Deluxe", price: 8000, available: true },
            { type: "Premium", price: 12000, available: false },
            { type: "Suite", price: 15000, available: true }
        ];
 
        function findAvailableRooms(minPrice, maxPrice) {
            return hotelRooms.filter(room =>
                room.price >= minPrice &&
                room.price <= maxPrice &&
                room.available
            );
        }
 
        function searchRooms() {
            const minPrice = parseInt(document.getElementById("minPrice").value);
            const maxPrice = parseInt(document.getElementById("maxPrice").value);
            
            if (isNaN(minPrice) || isNaN(maxPrice)) {
                alert("Please enter valid price values.");
                return;
            }
 
            const availableRooms = findAvailableRooms(minPrice, maxPrice);
            const roomList = document.getElementById("roomList");
            
            roomList.innerHTML = "";
 
            if (availableRooms.length === 0) {
                roomList.innerHTML = "<li>No available rooms in this range.</li>";
            } else {
                availableRooms.forEach(room => {
                    const listItem = document.createElement("li");
                    listItem.textContent = `${room.type} Room - ₹${room.price}`;
                    roomList.appendChild(listItem);
                });
            }
        }
    </script>
</body>
</html>
